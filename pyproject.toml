[project]
name = "skyvellum"
version = "0.1.0"
description = "SkyVellum - погодный телеграм бот"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.19,<4",
    "aiohttp>=3.11",
    "aiosqlite>=0.21",
    "apscheduler>=3.11,<4",
    "python-dotenv>=1.0",
    "pytz>=2025.1",
    "sqlalchemy>=2.0.39,<2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["bot/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
